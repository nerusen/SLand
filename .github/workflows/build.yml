name: Build SLand

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Step-level `if` cannot read secrets, so the keystore is lifted into the
    # job environment and tested from there.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore the signing keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sland.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"

      # Release is only built when a keystore exists. Without one, AGP emits an
      # unsigned release APK that Android refuses to install, so the run would
      # hand back a useless file.
      - name: Assemble
        id: assemble
        env:
          KEYSTORE_PRESENT: ${{ steps.keystore.outputs.present }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # The Maps tab's basemap key. CARTO has required one on every tile
          # request since 25 September 2026; without it the service answers
          # with an "API KEY REQUIRED" placeholder rather than a map. It is
          # compiled into the APK, which is safe only because the key is
          # restricted in CARTO's dashboard to this package name and this
          # signing certificate — so a build made with a different key, or by
          # someone who extracted this one, cannot use it.
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: |
          set -e
          if [ -z "$CARTO_KEY" ]; then
            echo "::warning::No CARTO_KEY secret. The Maps tab will say the basemap key is missing."
          fi
          if [ "$KEYSTORE_PRESENT" = "true" ]; then
            variants="debug release"
            tasks="assembleDebug assembleRelease"
            set -- \
              "-PSLAND_STORE=$RUNNER_TEMP/sland.jks" \
              "-PSLAND_STORE_PASSWORD=$STORE_PASSWORD" \
              "-PSLAND_KEY_ALIAS=${KEY_ALIAS:-sland}" \
              "-PSLAND_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}" \
              "-PCARTO_KEY=$CARTO_KEY"
          else
            echo "::notice::No KEYSTORE_BASE64 secret. Building debug only, with the Android debug key."
            variants="debug"
            tasks="assembleDebug"
            set -- "-PCARTO_KEY=$CARTO_KEY"
          fi
          set +e
          ./gradlew --no-daemon --console=plain --info $tasks "$@" > gradle-build.log 2>&1
          status=$?
          set -e
          cat gradle-build.log
          if [ "$status" -ne 0 ]; then
            echo "::group::Kotlin compiler diagnostics"
            grep -n -E '(^|[[:space:]])e: |(^|[[:space:]])w: |Compilation error|^> Task .*Kotlin FAILED' gradle-build.log || true
            echo "::endgroup::"
            exit "$status"
          fi
          echo "variants=$variants" >> "$GITHUB_OUTPUT"

      # Gradle already writes SLand-debug.apk and SLand-release.apk through
      # base.archivesName. This stamps the version and the short commit on top
      # so separate runs stay apart in the Actions download list.
      - name: Name the APKs
        id: name
        env:
          VARIANTS: ${{ steps.assemble.outputs.variants }}
        run: |
          set -e
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          short=$(git rev-parse --short HEAD)
          mkdir -p artifacts
          for variant in $VARIANTS; do
            src=$(find "app/build/outputs/apk/$variant" -name '*.apk' -print -quit)
            if [ -z "$src" ]; then
              echo "::error::No $variant APK was produced."
              exit 1
            fi
            cp "$src" "artifacts/SLand-${version}-${short}-${variant}.apk"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          ls -lh artifacts

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: SLand-${{ steps.name.outputs.version }}-${{ steps.name.outputs.short }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.name.outputs.version }}
          SHORT: ${{ steps.name.outputs.short }}
          VARIANTS: ${{ steps.assemble.outputs.variants }}
        run: |
          set -e
          git fetch --tags --force
          tag="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing_sha=$(git rev-list -n 1 "${tag}")
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              tag="v${VERSION}-${SHORT}"
            fi
          fi

          prev_tag=$(git describe --tags --abbrev=0 --match "v*" "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            range="${prev_tag}..${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}^..${GITHUB_SHA}"
          fi

          python3 - <<'PY' "$VERSION" "$SHORT" "$VARIANTS" "$GITHUB_SHA" "$prev_tag" "$range" > release_notes.md
          import subprocess, sys

          version, short, variants, sha, prev_tag, rev_range = sys.argv[1:7]
          fmt = "%h%x1f%s%x1f%b%x1e"
          raw = subprocess.check_output(
              ["git", "log", "--reverse", f"--format={fmt}", rev_range],
              text=True,
              errors="replace",
          )
          commits = []
          for entry in raw.split("\x1e"):
              entry = entry.strip()
              if not entry:
                  continue
              parts = entry.split("\x1f", 2)
              h = parts[0].strip()
              s = parts[1].strip() if len(parts) > 1 else ""
              b = parts[2].strip() if len(parts) > 2 else ""
              commits.append((h, s, b))

          if not commits:
              s = subprocess.check_output(["git", "log", "-1", "--format=%s", sha], text=True).strip()
              b = subprocess.check_output(["git", "log", "-1", "--format=%b", sha], text=True).strip()
              commits.append((short, s, b))

          print(f"## SLand v{version} (`{short}`)")
          print()
          if len(commits) == 1:
              h, s, b = commits[0]
              print(f"**{s}**")
              if b:
                  print()
                  print(b)
          else:
              print("Ringkasan pembaruan sejak rilis sebelumnya:")
              for h, s, b in commits:
                  print()
                  print(f"### {s} (`{h}`)")
                  if b:
                      print(b)
          print()
          print("---")
          print(f"- **Build variants:** {variants}")
          print(f"- **Commit:** `{sha}`")
          if prev_tag:
              print(f"- **Previous release:** `{prev_tag}`")
          PY

          title="SLand v${VERSION}"
          if [ "$tag" != "v${VERSION}" ]; then
            title="SLand v${VERSION} (${SHORT})"
          fi

          apks=()
          for f in artifacts/*-release.apk artifacts/*-debug.apk; do
            [ -f "$f" ] && apks+=("$f")
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release_notes.md
            gh release upload "$tag" "${apks[@]}" --clobber
          else
            gh release create "$tag" "${apks[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release_notes.md
          fi
